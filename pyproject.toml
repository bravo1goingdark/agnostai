[project]
name = "agnostai"
version = "0.1.0"
description = "Conversation intelligence engine for AI-agent conversations."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.2",
    "anyio>=4.6.2,<5.0.0",
    "arq>=0.26.1",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0,<1.0.0",
    "pgvector>=0.3.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "redis>=5.0.8",
    "sqlalchemy[asyncio]>=2.0.34",
    "uvicorn[standard]>=0.30.6,<1.0.0",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.27.2,<1.0.0",
    "mypy>=1.11.2",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.5",
]
ml = [
    "faiss-cpu>=1.9.0",
    "hdbscan>=0.8.38.post1",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.1",
    "sentence-transformers>=3.1.0",
]

[project.scripts]
agnost-seed-sample-data = "app.scripts.seed_sample_data:main"
agnost-run-clustering = "app.scripts.run_clustering:main"
agnost-export-report = "app.scripts.export_report:main"
agnost-demo-flow = "app.scripts.run_demo_flow:main"
agnost-recompute = "app.scripts.recompute:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_return_any = true
files = ["app"]

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "sentence_transformers.*",
    "vaderSentiment.*",
]
ignore_missing_imports = true
