<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agnost — Conversation Intelligence</title>
    <meta name="theme-color" content="#09090b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <span class="brand">Agnost</span>
        <div class="topbar-actions">
          <button class="button" id="bootstrap-button" type="button">Seed sample data</button>
          <button class="button ghost" id="refresh-button" type="button">Refresh</button>
        </div>
      </header>

      <main class="content">
        <section class="summary-strip" id="summary-strip"></section>

        <section class="panel">
          <div class="panel-header">
            <h2>Topics</h2>
            <span class="badge" id="topics-count">0 topics</span>
          </div>
          <div class="topic-grid" id="topic-grid"></div>
        </section>

        <section class="panel" id="detail-panel" hidden>
          <div class="panel-header">
            <div class="panel-header-row">
              <h2 id="detail-title">Topic detail</h2>
              <button class="button ghost" id="close-detail" type="button">Close</button>
            </div>
            <div class="detail-meta" id="detail-meta"></div>
          </div>
          <div class="conversation-list" id="conversation-list"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Observability</h2>
          </div>
          <div class="observability-grid" id="observability-grid">
            <div class="obs-card">
              <span class="obs-label">Queue depth</span>
              <strong class="obs-value" id="obs-queue">—</strong>
            </div>
            <div class="obs-card">
              <span class="obs-label">Failed jobs</span>
              <strong class="obs-value" id="obs-failed">—</strong>
            </div>
            <div class="obs-card">
              <span class="obs-label">Cluster duration</span>
              <strong class="obs-value" id="obs-duration">—</strong>
            </div>
            <div class="obs-card">
              <span class="obs-label">Last run</span>
              <strong class="obs-value" id="obs-last-run">—</strong>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span id="footer-status">Ready.</span>
        <span class="footer-meta" id="footer-meta"></span>
      </footer>
    </div>

    <script type="module" src="/assets/app.js"></script>
  </body>
  </html>
